[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostline-terminal"
version = "2.0.0"
description = "A local-first AI ghost that lives in your terminal."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
ghostline = "ghostline.cli:main"

[tool.setuptools]
packages = ["ghostline"]
